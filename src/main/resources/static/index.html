<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LLM Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .app {
            width: 100%;
            max-width: 800px;
            background: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e5e5;
            font-weight: 600;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .msg {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user { background: #1a73e8; color: #fff; margin-left: auto; max-width: 70%; }
        .assistant { background: #f1f3f4; color: #222; max-width: 85%; }
        .cursor { display: inline-block; width: 8px; height: 16px; background: #1a73e8;
            animation: blink 1s infinite; vertical-align: text-bottom; }
        @keyframes blink { 50% { opacity: 0; } }
        footer { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid #e5e5e5; }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #1a73e8; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #1a73e8;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="app">
    <header>LLM Agent</header>
    <div id="messages"></div>
    <footer>
        <input id="input" placeholder="输入消息，回车发送..." autocomplete="off">
        <button id="send">发送</button>
    </footer>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // 当前会话ID（由服务端管理，页面加载时获取）
    let conversationId = null;

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    /** 页面加载时：取最近的会话，没有就新建 */
    async function initConversation() {
        try {
            const list = await (await fetch('/conversation')).json();
            if (list.length > 0) {
                conversationId = list[0].id;
                await loadMessages();
            } else {
                const created = await (await fetch('/conversation', { method: 'POST' })).json();
                conversationId = created.id;
            }
            console.log('当前会话ID =', conversationId);
        } catch (e) {
            alert('初始化会话失败：' + e.message);
        }
    }

    /** 从数据库恢复历史消息 */
    async function loadMessages() {
        const msgs = await (await fetch('/conversation/' + conversationId + '/messages')).json();
        messagesEl.innerHTML = '';
        msgs.forEach(m => addMessage(m.role === 'user' ? 'user' : 'assistant', m.content));
    }

    function send() {
        const text = inputEl.value.trim();
        if (!text || !conversationId) return;

        addMessage('user', text);
        inputEl.value = '';
        sendBtn.disabled = true;

        const aiDiv = addMessage('assistant', '');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        aiDiv.appendChild(cursor);

        fetch('/chat/stream?conversationId=' + conversationId, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: text
        }).then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        cursor.remove();
                        sendBtn.disabled = false;
                        return;
                    }
                    const chunk = decoder.decode(value, { stream: true });
                    chunk.split('\n').forEach(line => {
                        if (!line.startsWith('data:')) return;
                        cursor.insertAdjacentText('beforebegin', line.substring(5));
                    });
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    read();
                });
            }
            read();
        }).catch(err => {
            cursor.remove();
            sendBtn.disabled = false;
            alert('请求失败：' + err.message);
        });
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') send();
    });

    // 页面加载完成就初始化会话
    initConversation();
</script>
</body>
</html>
