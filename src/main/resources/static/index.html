<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LLM Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .app {
            width: 100%;
            max-width: 800px;
            background: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e5e5;
            font-weight: 600;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .msg {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user { background: #1a73e8; color: #fff; margin-left: auto; max-width: 70%; }
        .assistant { background: #f1f3f4; color: #222; max-width: 85%; }
        .cursor { display: inline-block; width: 8px; height: 16px; background: #1a73e8;
            animation: blink 1s infinite; vertical-align: text-bottom; }
        @keyframes blink { 50% { opacity: 0; } }
        footer { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid #e5e5e5; }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #1a73e8; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #1a73e8;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="app">
    <header>LLM Agent</header>
    <div id="messages"></div>
    <footer>
        <input id="input" placeholder="输入消息，回车发送..." autocomplete="off">
        <button id="send">发送</button>
    </footer>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // 系统提示词：约束模型的输出风格（这属于 Prompt 工程）
    const SYSTEM_PROMPT = '你是一个乐于助人的中文AI助手。请用纯文本自然段落回答，' +
        '不要使用任何 Markdown 语法（如 ** 加粗、# 标题、- 列表符号），' +
        '回答简洁准确。';

    let history = [{ role: 'system', content: SYSTEM_PROMPT }];

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    function send() {
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputEl.value = '';
        sendBtn.disabled = true;

        // 把用户这条也记进历史
        history.push({ role: 'user', content: text });

        // 只保留最近 20 条，避免上下文过长导致 token 爆炸
        if (history.length > 20) {
            history = history.slice(history.length - 20);
        }

        const aiDiv = addMessage('assistant', '');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        aiDiv.appendChild(cursor);

        let fullAnswer = '';

        // 用 fetch 发 POST（EventSource 不支持 POST）
        fetch('/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(history)
        }).then(response => {
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');

            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        // 流结束：把 AI 的完整回答记进历史
                        history.push({ role: 'assistant', content: fullAnswer });
                        cursor.remove();
                        sendBtn.disabled = false;
                        return;
                    }
                    const chunk = decoder.decode(value, { stream: true });

                    // 解析 SSE 格式：每块形如 "data:内容\n\n"
                    chunk.split('\n').forEach(line => {
                        if (!line.startsWith('data:')) return;
                        const content = line.substring(5);
                        fullAnswer += content;
                        cursor.insertAdjacentText('beforebegin', content);
                    });

                    messagesEl.scrollTop = messagesEl.scrollHeight;
                    read();
                });
            }
            read();
        }).catch(err => {
            cursor.remove();
            sendBtn.disabled = false;
            alert('请求失败：' + err.message);
        });
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') send();
    });
</script>
</body>
</html>
