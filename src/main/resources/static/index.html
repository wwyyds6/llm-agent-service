<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LLM Agent</title>
    <link rel="icon" href="data:,">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .app {
            width: 100%;
            max-width: 1000px;
            background: #fff;
            display: flex;
            height: 100vh;
        }
        /* 左侧会话列表 */
        .sidebar {
            width: 220px;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }
        .sidebar button#newChat {
            margin: 12px;
            padding: 10px;
            border: 1px dashed #1a73e8;
            background: #fff;
            color: #1a73e8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .sidebar button#newChat:hover { background: #e8f0fe; }
        #convList { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
        }
        .conv-item:hover { background: #eef1f5; }
        .conv-item.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; }
        .conv-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .conv-del {
            border: none;
            background: transparent;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            line-height: 1;
        }
        .conv-del:hover { color: #d93025; }
        /* 右侧主区 */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e5e5;
            font-weight: 600;
        }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user { background: #1a73e8; color: #fff; margin-left: auto; max-width: 70%; }
        .assistant { background: #f1f3f4; color: #222; max-width: 85%; }
        .cursor { display: inline-block; width: 8px; height: 16px; background: #1a73e8;
            animation: blink 1s infinite; vertical-align: text-bottom; }
        @keyframes blink { 50% { opacity: 0; } }
        .tool-chip {
            display: inline-block;
            margin: 0 6px 6px 0;
            padding: 3px 10px;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            font-size: 12px;
        }
        footer { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid #e5e5e5; }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #1a73e8; }
        footer button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #1a73e8;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        footer button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <button id="newChat">+ 新会话</button>
        <div id="convList"></div>
    </aside>

    <div class="main">
        <header>LLM Agent</header>
        <div id="messages"></div>
        <footer>
            <input id="input" placeholder="输入消息，回车发送..." autocomplete="off">
            <button id="send">发送</button>
        </footer>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const convListEl = document.getElementById('convList');
    const newChatBtn = document.getElementById('newChat');

    let conversationId = null;

    /** 统一请求：自动解包 Result */
    async function api(url, options) {
        const res = await (await fetch(url, options)).json();
        if (res.code !== 200) {
            throw new Error(res.message || '请求失败');
        }
        return res.data;
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    /** 加载左侧会话列表 */
    async function loadConversationList() {
        const list = await api('/conversation');
        convListEl.innerHTML = '';

        list.forEach(c => {
            const item = document.createElement('div');
            item.className = 'conv-item' + (c.id === conversationId ? ' active' : '');

            const title = document.createElement('span');
            title.className = 'conv-title';
            title.textContent = c.title || ('会话 ' + c.id);
            title.title = '双击可重命名';

            // 双击重命名
            title.ondblclick = async (e) => {
                e.stopPropagation();
                const newTitle = prompt('输入新的会话名称：', c.title || '');
                if (newTitle === null) return;
                try {
                    await api('/conversation/' + c.id + '/title', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: newTitle })
                    });
                    await loadConversationList();
                } catch (err) {
                    alert('重命名失败：' + err.message);
                }
            };

            // 删除
            const del = document.createElement('button');
            del.className = 'conv-del';
            del.textContent = '×';
            del.title = '删除会话';
            del.onclick = async (e) => {
                e.stopPropagation();
                if (!confirm('确认删除该会话及其全部消息？')) return;
                try {
                    await api('/conversation/' + c.id, { method: 'DELETE' });
                    if (c.id === conversationId) {
                        conversationId = null;
                        messagesEl.innerHTML = '';
                    }
                    const rest = await api('/conversation');
                    if (conversationId === null) {
                        if (rest.length > 0) {
                            await switchConversation(rest[0].id);
                        } else {
                            const created = await api('/conversation', { method: 'POST' });
                            await switchConversation(created.id);
                        }
                    } else {
                        await loadConversationList();
                    }
                } catch (err) {
                    alert('删除失败：' + err.message);
                }
            };

            item.appendChild(title);
            item.appendChild(del);
            item.onclick = () => switchConversation(c.id);
            convListEl.appendChild(item);
        });
    }

    /** 切换会话 */
    async function switchConversation(id) {
        conversationId = id;
        await loadMessages();
        await loadConversationList();
    }

    /** 从数据库恢复当前会话的消息 */
    async function loadMessages() {
        const msgs = await api('/conversation/' + conversationId + '/messages');
        messagesEl.innerHTML = '';
        msgs.forEach(m => addMessage(m.role === 'user' ? 'user' : 'assistant', m.content));
    }

    /** 页面初始化 */
    async function init() {
        try {
            const list = await api('/conversation');
            if (list.length > 0) {
                conversationId = list[0].id;
                await loadMessages();
            } else {
                const created = await api('/conversation', { method: 'POST' });
                conversationId = created.id;
            }
            await loadConversationList();
        } catch (e) {
            alert('初始化失败：' + e.message);
        }
    }

    function send() {
        const text = inputEl.value.trim();
        if (!text || !conversationId) return;

        addMessage('user', text);
        inputEl.value = '';
        sendBtn.disabled = true;

        const aiDiv = addMessage('assistant', '');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        aiDiv.appendChild(cursor);

        fetch('/agent/stream?conversationId=' + conversationId, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: text
        }).then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            function handleBlock(block) {
                let event = 'message';
                let data = '';
                block.split('\n').forEach(line => {
                    if (line.startsWith('event:')) event = line.substring(6).trim();
                    else if (line.startsWith('data:')) data += line.substring(5);
                });
                if (!data) return;
                let obj;
                try { obj = JSON.parse(data); } catch (e) { return; }

                if (event === 'delta') {
                    cursor.insertAdjacentText('beforebegin', obj.text);
                } else if (event === 'tool') {
                    const chip = document.createElement('span');
                    chip.className = 'tool-chip';
                    chip.textContent = '🔧 ' + obj.name + ' · ' + obj.costMs + 'ms';
                    aiDiv.insertBefore(chip, cursor);
                }
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function read() {
                reader.read().then(({ done, value }) => {
                    if (done) {
                        cursor.remove();
                        sendBtn.disabled = false;
                        return;
                    }
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) >= 0) {
                        const block = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        handleBlock(block);
                    }
                    read();
                });
            }
            read();
        }).catch(err => {
            cursor.remove();
            sendBtn.disabled = false;
            alert('请求失败：' + err.message);
        });
    }

    newChatBtn.onclick = async function () {
        try {
            const created = await api('/conversation', { method: 'POST' });
            messagesEl.innerHTML = '';
            await switchConversation(created.id);
        } catch (e) {
            alert('新建会话失败：' + e.message);
        }
    };

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') send();
    });

    init();
</script>
</body>
</html>
